name: Run VAG OEM WV232 on Android Emulator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-apk-emulator.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-run:
    name: Build, launch and capture app screens
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Launch APK and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash .github/scripts/run-emulator-preview.sh

      - name: Upload emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VAG-OEM-WV232-0.11.0-ANDROID-EMULATOR-PREVIEW
          path: emulator-preview/
          if-no-files-found: warn
          retention-days: 14

      - name: Emulator execution summary
        if: always()
        run: |
          echo "## VAG OEM WV232 · Android Emulator" >> "$GITHUB_STEP_SUMMARY"
          echo "Se intentó compilar e iniciar la APK en Android Emulator API 35 con resolución lógica 1024×600." >> "$GITHUB_STEP_SUMMARY"
          echo "Las capturas, el índice HTML y logcat se publican en el artefacto de esta ejecución." >> "$GITHUB_STEP_SUMMARY"
          echo "La prueba virtual no valida CANBUS, MCU, cámara ni periféricos del estéreo físico." >> "$GITHUB_STEP_SUMMARY"
