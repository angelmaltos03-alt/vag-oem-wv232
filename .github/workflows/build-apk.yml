name: Build VAG OEM WV232 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-apk:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon --stacktrace clean assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VAG-OEM-WV232-0.13.1-BASE-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        if: success()
        run: |
          echo "## VAG OEM WV232 0.13.1-BASE — APK generado" >> "$GITHUB_STEP_SUMMARY"
          echo "Módulos: Launcher OEM + MapLibre Navigation + Offline Map Manager + Valhalla engine + Local Alerts + Sound Studio + Vehicle telemetry UI" >> "$GITHUB_STEP_SUMMARY"
          echo "Aviso: los valores CANBUS permanecen sin lectura hasta integrar un decodificador compatible." >> "$GITHUB_STEP_SUMMARY"
