name: Build offline routing data and integrated APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build-valhalla-region.sh'
      - '.github/workflows/build-offline-route-data.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
jobs:
  build-route-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install OSM extract tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: Build Durango and Coahuila Valhalla graph
        run: bash tools/build-valhalla-region.sh "$RUNNER_TEMP/vag-route-data"
      - name: Publish route graph package
        uses: actions/upload-artifact@v4
        with:
          name: VAG-OEM-Durango-Coahuila-Valhalla-Tiles
          path: ${{ runner.temp }}/vag-route-data/valhalla_tiles.tar
          if-no-files-found: error
          retention-days: 30

  build-apk-with-offline-graph:
    needs: build-route-graph
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download regional route graph
        uses: actions/download-artifact@v4
        with:
          name: VAG-OEM-Durango-Coahuila-Valhalla-Tiles
          path: app/src/main/assets
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build single APK with offline routing graph
        run: gradle --no-daemon --stacktrace clean assembleDebug
      - name: Upload integrated APK
        uses: actions/upload-artifact@v4
        with:
          name: VAG-OEM-WV232-0.11.0-OFFLINE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build summary
        if: success()
        run: |
          echo "## VAG OEM WV232 0.11.0 — APK con grafo offline" >> "$GITHUB_STEP_SUMMARY"
          echo "La APK incluye el motor Valhalla y el grafo vial regional Durango-Coahuila." >> "$GITHUB_STEP_SUMMARY"
