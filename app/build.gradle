plugins { id 'com.android.application' }
android {
 namespace 'com.vagoem.polo'
 compileSdk 35
 defaultConfig { applicationId 'com.vagoem.polo'; minSdk 24; targetSdk 32; versionCode 12; versionName '0.10.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
 implementation 'org.maplibre.gl:android-sdk:13.6.1'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 // Native offline turn-by-turn routing engine; regional Valhalla graph tiles are installed separately.
 implementation 'io.github.rallista:valhalla-mobile:0.6.3'
 implementation 'io.github.rallista:valhalla-models:0.5.2'
 implementation 'io.github.rallista:valhalla-models-config:0.5.2'
}